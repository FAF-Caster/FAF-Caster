name: Desktop CI and Stable Release

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-main-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calculate next stable version
        id: next
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]] || { echo 'Main advanced; this run is stale.' >&2; exit 1; }
          prefix="v$(date -u +%y.%m)."
          last=-1
          while IFS= read -r tag; do
            suffix="${tag#"$prefix"}"
            if [[ "$suffix" =~ ^[0-9]+$ ]]; then
              number=$((10#$suffix))
              if (( number > last )); then last=$number; fi
            fi
          done < <(git tag --list "${prefix}*")
          tag="${prefix}$((last + 1))"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: FAF.Caster.dashboard/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install dashboard dependencies
        working-directory: FAF.Caster.dashboard
        run: npm ci
      - name: Publish Windows desktop and Bridge
        shell: pwsh
        env:
          FAF_CASTER_RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: ./scripts/publish-desktop.ps1
      - name: Verify portable desktop contents
        shell: pwsh
        run: |
          $out = 'artifacts/FAF-Caster-Desktop'
          foreach ($file in @("$out/FAF.Caster.Desktop.exe", "$out/bridge/FAFCaster.Bridge.exe", "$out/dashboard/index.html")) {
            if (-not (Test-Path $file)) { throw "Missing release component: $file" }
          }
      - name: Package portable desktop
        shell: pwsh
        run: Compress-Archive -Path artifacts/FAF-Caster-Desktop -DestinationPath artifacts/FAF-Caster-Desktop-win-x64.zip -Force
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $version = if ($env:RELEASE_VERSION) { $env:RELEASE_VERSION } else { '0.0.0' }
          $compiler = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "/DMyAppVersion=$version" "installer/FAF-Caster.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          $setup = "artifacts/FAF-Caster-Setup-v$version-win-x64.exe"
          if (-not (Test-Path $setup)) { throw "Missing installer: $setup" }
      - name: Upload installer build
        uses: actions/upload-artifact@v4
        with:
          name: FAF-Caster-Setup-win-x64
          path: artifacts/FAF-Caster-Setup-v*-win-x64.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: FAF-Caster-Desktop-win-x64
          path: artifacts/FAF-Caster-Desktop-win-x64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: FAF-Caster-Desktop-win-x64
      - uses: actions/download-artifact@v4
        with:
          name: FAF-Caster-Setup-win-x64
      - name: Create release notes and tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]] || { echo "Invalid tag: $TAG" >&2; exit 1; }
          git fetch origin main --tags
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]] || { echo 'Main advanced; refusing to release stale build.' >&2; exit 1; }
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; refusing overwrite." >&2
            exit 1
          fi
          mv FAF-Caster-Desktop-win-x64.zip "FAF-Caster-Desktop-${TAG}-win-x64.zip"\n          installer="FAF-Caster-Setup-${TAG}-win-x64.exe"\n          test -f "$installer" || { echo "Missing installer: $installer" >&2; exit 1; }
          gh api "repos/${GH_REPO}/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq '.body' > generated-changelog.md
          {
            echo "## Installation"
            echo
            echo "1. Download \`FAF-Caster-Setup-${TAG}-win-x64.exe\` and run the installer."
            echo "2. Launch FAF Caster from the Start menu (or optional desktop shortcut)."
            echo "3. Install and enable the matching [FAF Caster Bridge UI mod](https://github.com/FAF-Caster/faf-caster-ui-mod/releases)."
            echo
            echo "The installer includes the desktop app, telemetry Bridge, and dashboard. A portable ZIP is also available for advanced users."
            echo
            echo "## Changes"
            echo
            cat generated-changelog.md
          } > release-notes.md
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$GITHUB_SHA" ]] || { echo 'Main advanced; refusing stale tag.' >&2; exit 1; }
          gh api "repos/${GH_REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="$GITHUB_SHA" >/dev/null
          gh release create "$TAG" "$installer" "FAF-Caster-Desktop-${TAG}-win-x64.zip" --verify-tag --title "FAF Caster Desktop $TAG" --notes-file release-notes.md
