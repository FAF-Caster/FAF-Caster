name: Desktop CI

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: FAF.Caster.dashboard/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install dashboard dependencies
        working-directory: FAF.Caster.dashboard
        run: npm ci
      - name: Publish Windows desktop and Bridge
        shell: pwsh
        run: ./scripts/publish-desktop.ps1
      - name: Package portable desktop
        shell: pwsh
        run: Compress-Archive -Path artifacts/FAF-Caster-Desktop -DestinationPath artifacts/FAF-Caster-Desktop-win-x64.zip -Force
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: FAF-Caster-Desktop-win-x64
          path: artifacts/FAF-Caster-Desktop-win-x64.zip
          if-no-files-found: error
          retention-days: 14
